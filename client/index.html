<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Papa Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <h1>Juego de la Papa</h1>
            <div class="lobby-controls">
                <input type="text" id="username-input" placeholder="Tu Nombre" maxlength="10">
                <div class="input-group">
                    <label for="point-count-select">Cantidad de Puntos:</label>
                    <select id="point-count-select"
                        style="padding: 15px; font-size: 1.2rem; background: transparent; border: none; border-bottom: 2px solid var(--text-color); color: var(--text-color); outline: none; width: 100%;">
                        <option value="10">10 puntos</option>
                        <option value="15">15 puntos</option>
                        <option value="20" selected>20 puntos</option>
                        <option value="25">25 puntos</option>
                        <option value="30">30 puntos</option>
                    </select>
                </div>
                <button id="create-room-btn" class="primary-btn">Crear Sala</button>
                <div class="join-room">
                    <input type="text" id="room-code-input" placeholder="Código de Sala" maxlength="6">
                    <button id="join-room-btn" class="secondary-btn">Unirse a Sala</button>
                </div>
                <button id="stats-btn" class="secondary-btn" style="margin-top: 10px;">📊 Estadísticas</button>

                <div id="my-games-container"
                    style="width: 100%; border-top: 2px dashed var(--text-color); padding-top: 1rem;">
                    <h3>Mis Partidas</h3>
                    <div id="my-games-list"
                        style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                        <!-- Games will be injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Credits Footer (outside lobby card) -->
        <div
            style="position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 0.9rem; color: var(--text-color); opacity: 0.7;">
            Hecho con 🧉 por <a href="https://iyaki.ar/" target="_blank" rel="noopener noreferrer"
                style="color: var(--text-color); text-decoration: underline;">iyaki</a> - Idea original: Lucas Pacheco
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div id="game-info">
                <button id="back-to-menu-btn" class="primary-btn"
                    style="margin-right: 10px; font-size: 1rem; padding: 5px 10px;">Menú</button>
                <div id="turn-indicator">
                    <span id="current-player-display">Esperando...</span>
                </div>
                <div id="next-number">
                    Siguiente: <span id="next-number-display">1</span>
                </div>
                <div id="room-info">
                    Sala: <span id="room-code-display"></span>
                    <button id="share-btn" class="icon-btn" aria-label="Compartir">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>
                </div>
                <button id="surrender-btn" class="secondary-btn"
                    style="background-color: #ff4646; color: white; margin-top: 10px;">Rendirse</button>
            </div>
            <div class="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>

            <div class="game-footer">
                Sala: <span id="room-code-display">---</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <div class="modal-content">
                <h2 id="game-over-message">Juego Terminado</h2>
                <button id="restart-btn" class="primary-btn">Volver al Lobby</button>
                <button id="export-btn" class="primary-btn" style="margin-top: 10px;">📸 Guardar Recuerdo</button>
            </div>
        </div>

        <div id="stats-screen" class="hidden">
            <h2>Estadísticas</h2>
            <div id="stats-summary" style="display: flex; justify-content: space-around; margin-bottom: 20px;">
                <div style="text-align: center;">
                    <div style="font-size: 2em; color: #4caf50;" id="total-wins">0</div>
                    <div>Victorias</div>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 2em; color: #f44336;" id="total-losses">0</div>
                    <div>Derrotas</div>
                </div>
            </div>
            <div id="stats-list" style="max-height: 60vh; overflow-y: auto; text-align: left; margin-bottom: 20px;">
                <!-- Items will be injected here -->
            </div>
            <button id="close-stats-btn" class="primary-btn">Volver al Lobby</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
