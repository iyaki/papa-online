<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Papa Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <h1>Juego de la Papa</h1>
            <div class="lobby-controls">
                <input type="text" id="username-input" placeholder="Tu Nombre" maxlength="10">
                <button id="create-room-btn" class="primary-btn">Crear Sala</button>
                <div class="join-room">
                    <input type="text" id="room-code-input" placeholder="Código de Sala">
                    <button id="join-room-btn" class="secondary-btn">Unirse</button>
                </div>

                <div id="my-games-container"
                    style="width: 100%; border-top: 2px dashed var(--text-color); padding-top: 1rem;">
                    <h3>Mis Partidas</h3>
                    <div id="my-games-list"
                        style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                        <!-- Games will be injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div id="game-info">
                <button id="back-to-menu-btn" class="primary-btn"
                    style="margin-right: 10px; font-size: 1rem; padding: 5px 10px;">Menú</button>
                <div id="turn-indicator">
                    <span id="current-player-display">Esperando...</span>
                </div>
                <div id="next-number">
                    Siguiente: <span id="next-number-display">1</span>
                </div>
                <div id="room-info">
                    Sala: <span id="room-code-display"></span>
                    <button id="share-btn" class="icon-btn" aria-label="Compartir">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>
                </div>
                <button id="surrender-btn" class="secondary-btn"
                    style="background-color: #ff4646; color: white; margin-top: 10px;">Rendirse</button>
            </div>
            <div class="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>

            <div class="game-footer">
                Sala: <span id="room-code-display">---</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <div class="modal-content">
                <h2 id="game-over-message">Juego Terminado</h2>
                <button id="restart-btn" class="primary-btn">Volver al Lobby</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
